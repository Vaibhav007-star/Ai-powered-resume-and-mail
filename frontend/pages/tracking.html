<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Tracking & Kanban - Resume & Email Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Application Funnel & Analytics</h1>
      <a href="/" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">← Back to Dashboard</a>
    </div>

    <!-- Analytics Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
        <p class="text-xs font-semibold text-slate-500">Ingested Jobs</p>
        <p id="statTotalIngested" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
        <p class="text-xs font-semibold text-slate-500">Applications Sent</p>
        <p id="statTotalDispatched" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
        <p class="text-xs font-semibold text-slate-500">Responses Received</p>
        <p id="statTotalResponses" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
        <p class="text-xs font-semibold text-slate-500">Overall Response Rate</p>
        <p id="statResponseRate" class="text-2xl font-bold text-amber-600 mt-1">0%</p>
      </div>
    </div>

    <!-- Kanban Board -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Drafts -->
      <div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200/60 space-y-3">
        <div class="flex items-center justify-between">
          <h4 class="font-bold text-slate-700 text-xs uppercase tracking-wider">Drafts</h4>
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        </div>
        <div id="colDrafts" class="space-y-3"></div>
      </div>

      <!-- Sent -->
      <div class="bg-indigo-50/50 rounded-2xl p-4 border border-indigo-100 space-y-3">
        <div class="flex items-center justify-between">
          <h4 class="font-bold text-indigo-800 text-xs uppercase tracking-wider">Sent</h4>
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
        </div>
        <div id="colSent" class="space-y-3"></div>
      </div>

      <!-- Replied -->
      <div class="bg-emerald-50/50 rounded-2xl p-4 border border-emerald-100 space-y-3">
        <div class="flex items-center justify-between">
          <h4 class="font-bold text-emerald-800 text-xs uppercase tracking-wider">Replied</h4>
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        </div>
        <div id="colReplied" class="space-y-3"></div>
      </div>

      <!-- Interview -->
      <div class="bg-amber-50/50 rounded-2xl p-4 border border-amber-100 space-y-3">
        <div class="flex items-center justify-between">
          <h4 class="font-bold text-amber-800 text-xs uppercase tracking-wider">Interviewing</h4>
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
        </div>
        <div id="colInterview" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/phase5_tracking.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadTrackingDashboard();
    });
  </script>
</body>
</html>
