<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Profile - Resume & Email Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Candidate Profile Studio</h1>
      <a href="/" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">← Back to Dashboard</a>
    </div>

    <!-- Profile Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" id="profName" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="profEmail" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
          <input type="text" id="profPhone" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Technical Skills (Comma separated)</label>
        <input type="text" id="profSkills" placeholder="Python, FastAPI, React, PostgreSQL, Docker..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Professional Summary</label>
        <textarea id="profSummary" rows="3" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Experienced software engineer with a background in building scalable web applications..."></textarea>
      </div>

      <!-- Experience Section -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-800">Work Experience</h3>
          <button onclick="addExperienceRow()" class="px-3 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-semibold text-xs rounded-lg transition">+ Add Role</button>
        </div>
        <div id="experienceList" class="space-y-3"></div>
      </div>

      <!-- Projects Section -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-800">Key Projects</h3>
          <button onclick="addProjectRow()" class="px-3 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-semibold text-xs rounded-lg transition">+ Add Project</button>
        </div>
        <div id="projectsList" class="space-y-3"></div>
      </div>

      <!-- Resumes List -->
      <div class="space-y-3 pt-4 border-t border-slate-100">
        <h3 class="text-sm font-bold text-slate-800">Uploaded Resumes</h3>
        <div id="resumeListContainer" class="space-y-2"></div>
      </div>

      <div class="pt-4 flex justify-end">
        <button onclick="saveProfile()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-xs transition">Save Profile Changes</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/phase1_profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
    });
  </script>
</body>
</html>
